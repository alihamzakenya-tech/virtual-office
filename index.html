<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual AI Command Center</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .office-container {
            width: 100%;
            max-width: 900px;
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 28px;
            color: #ffffff;
        }

        .control-panel {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 30px;
            border: 1px solid #334155;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #start-btn {
            background-color: #2563eb;
            color: white;
        }

        #start-btn:hover {
            background-color: #1d4ed8;
        }

        #send-text-btn {
            background-color: #10b981;
            color: white;
        }

        #send-text-btn:hover {
            background-color: #059669;
        }

        .input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        #text-command {
            flex: 1;
            padding: 12px 15px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #1e293b;
            color: white;
            font-size: 14px;
            outline: none;
        }

        #text-command:focus {
            border-color: #2563eb;
        }

        #status {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 10px;
        }

        .floor {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .agent-card {
            background-color: #0f172a;
            border: 2px solid #334155;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .agent-card.active {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
            transform: translateY(-3px);
        }

        .agent-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .agent-card h3 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            background-color: #334155;
            color: #cbd5e1;
        }

        .terminal {
            background-color: #090d16;
            border-radius: 8px;
            padding: 15px;
            border: 1px solid #1e293b;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
        }

        .terminal-header {
            color: #64748b;
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 5px;
        }

        .log-entry {
            margin-bottom: 6px;
            color: #38bdf8;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="office-container">
        <h1>Virtual AI Command Center</h1>

        <div class="control-panel">
            <div class="btn-container">
                <button id="start-btn">🎤 Speak Command</button>
            </div>

            <div class="input-group">
                <input type="text" id="text-command" placeholder="Type command (e.g. 'Create a Facebook ad post')...">
                <button id="send-text-btn">Send Text</button>
            </div>

            <p id="status">Status: Waiting for command...</p>
        </div>

        <div class="floor">
            <div class="agent-card" id="desk-marketing">
                <div class="agent-icon">👨‍💻</div>
                <h3>Marketing Agent</h3>
                <span class="badge" id="badge-marketing">Idle</span>
            </div>

            <div class="agent-card" id="desk-support">
                <div class="agent-icon">👩‍💼</div>
                <h3>Support Agent</h3>
                <span class="badge" id="badge-support">Idle</span>
            </div>

            <div class="agent-card" id="desk-logistics">
                <div class="agent-icon">🤖</div>
                <h3>Logistics Agent</h3>
                <span class="badge" id="badge-logistics">Idle</span>
            </div>
        </div>

        <div class="terminal">
            <div class="terminal-header">Activity Log:</div>
            <div id="activity-log">
                <div class="log-entry">Office is online and ready...</div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
